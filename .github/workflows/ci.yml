name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test installation and restoration in a sandbox
        shell: pwsh
        run: ./scripts/Test-Package.ps1
